name: Release smoke

on:
  workflow_dispatch:
  push:
    branches: [release-smoke]

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OZERO_KEYSTORE_PASSWORD: ${{ secrets.OZERO_KEYSTORE_PASSWORD }}
      OZERO_KEY_ALIAS: ${{ secrets.OZERO_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost; df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.OZERO_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ozero.keystore"
          echo "OZERO_KEYSTORE=$RUNNER_TEMP/ozero.keystore" >> "$GITHUB_ENV"
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
      - name: Smoke in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 3000M
          cores: 4
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/smoke/run.sh
      - name: Shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-shots
          path: shots/
