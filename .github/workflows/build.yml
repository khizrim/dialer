name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OZERO_KEYSTORE_PASSWORD: ${{ secrets.OZERO_KEYSTORE_PASSWORD }}
      OZERO_KEY_ALIAS: ${{ secrets.OZERO_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.OZERO_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ozero.keystore"
          echo "OZERO_KEYSTORE=$RUNNER_TEMP/ozero.keystore" >> "$GITHUB_ENV"
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Android Lint
        run: ./gradlew lintDebug --stacktrace
      - name: Lint findings in log
        if: failure()
        run: find app/build -name 'lint-results-debug.txt' -exec cat {} \;
      - name: Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: dialer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      # для основного телефона: без режима отладки, тот же ключ
      - uses: actions/upload-artifact@v4
        with:
          name: ozero-phone-release-apk
          path: app/build/outputs/apk/release/*.apk
      # ручной запуск собирает и выпускает релиз: подписанный APK с номером сборки (versionCode)
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && env.OZERO_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(( GITHUB_RUN_NUMBER + 100 ))
          VN=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          cp app/build/outputs/apk/release/*.apk "ozero-phone-$V.apk"
          NOTES=".github/release-notes.md"
          [ -f "$NOTES" ] || echo "Сборка $V" > "$NOTES"
          gh release create "build-$V" "ozero-phone-$V.apk" --target "$GITHUB_SHA" \
            --title "Ozero Phone $VN · сборка $V" --notes-file "$NOTES" --latest
