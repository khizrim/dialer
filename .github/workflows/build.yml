name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OZERO_KEYSTORE_PASSWORD: ${{ secrets.OZERO_KEYSTORE_PASSWORD }}
      OZERO_KEY_ALIAS: ${{ secrets.OZERO_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.OZERO_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ozero.keystore"
          echo "OZERO_KEYSTORE=$RUNNER_TEMP/ozero.keystore" >> "$GITHUB_ENV"
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: dialer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
