name: Emulator review

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-91xlt7]

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost; df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Run review in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 3000M
          cores: 4
          ram-size: 3072M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/emulator/run.sh
      - name: Frame sheets
        if: always()
        run: |
          sudo apt-get -qq install -y ffmpeg >/dev/null || true
          cd shots || exit 0
          for v in anim-*.mp4; do [ -f "$v" ] || continue; ffmpeg -loglevel error -ss 0.9 -i "$v" -vf "fps=20,scale=216:-1,tile=10x4" -frames:v 1 "sheet-${v%.mp4}.png" || true; done
          for v in [!a]*.mp4; do [ -f "$v" ] || continue; ffmpeg -loglevel error -i "$v" -vf "fps=10,scale=216:-1,tile=10x4" -frames:v 1 "sheet-${v%.mp4}.png" || true; done
      - name: Publish shots
        if: always()
        run: |
          [ -d shots ] || exit 0
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan review-shots
          git rm -rq --cached . ; find . -mindepth 1 -maxdepth 1 ! -name shots ! -name .git -exec rm -rf {} +
          rm -f shots/*.mp4
          git add shots; git commit -qm "shots ${GITHUB_SHA::7}"
          git push -f origin review-shots
